version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: restaurant_emp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
  web:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/restaurant_emp
    depends_on:
      - db
